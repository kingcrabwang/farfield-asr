[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farfield-asr"
version = "0.1.0"
description = "Reproducible multichannel speech frontend and ASR evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "soundfile>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
simulation = ["pyroomacoustics==0.10.1"]
evaluation = ["pesq==0.0.4", "pystoi==0.4.1"]
data = ["oss2==2.19.1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

