# FunASR ONNX 0.4.1 依赖 NumPy <=1.26.4，与已经验收的前端环境分离。
name: farfield-asr-decode
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - numpy=1.26.4
  - scipy>=1.12,<2
  - matplotlib-base=3.10.3
  - pysoundfile
  - pyyaml
  - pip:
      - funasr-onnx==0.4.1
      - onnxruntime==1.22.1
      - sentencepiece==0.2.1
      - jieba==0.42.1
